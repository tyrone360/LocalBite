<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#397bd2"/>
      <stop offset="1" stop-color="#153c78"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a2"/>
      <stop offset="1" stop-color="#d7a63e"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="505" rx="235" ry="35" fill="#183d70" opacity=".12" filter="url(#shadow)"/>

  <circle cx="400" cy="290" r="205" fill="#dceaff" opacity=".48"/>
  <circle cx="400" cy="290" r="155" fill="#fff" opacity=".35"/>

  <!-- Floating connection symbol -->
  <g transform="translate(560 105)">
    <circle r="55" fill="#fff" opacity=".75"/>
    <path d="M-24 -8 Q0 -32 24 -8 M-16 5 Q0 -11 16 5 M-6 18 Q0 12 6 18"
      fill="none" stroke="#2865b5" stroke-width="8" stroke-linecap="round"/>
    <path d="M-31 31 L31 -31" stroke="#d5a33d" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Floating burger -->
  <g transform="translate(180 185) rotate(-13)">
    <ellipse cx="0" cy="36" rx="65" ry="13" fill="#b66a26"/>
    <path d="M-60 20 C-58 -28 58 -28 60 20Z" fill="#e9ad51"/>
    <path d="M-58 22 Q0 40 58 22" fill="none" stroke="#f9d58c" stroke-width="7"/>
    <path d="M-58 30 L58 30 L51 42 L-51 42Z" fill="#6d9e42"/>
    <path d="M-52 42 Q0 59 52 42 L45 53 L-45 53Z" fill="#b86b30"/>
    <g fill="#fff0c8">
      <ellipse cx="-25" cy="1" rx="4" ry="2"/>
      <ellipse cx="5" cy="-8" rx="4" ry="2"/>
      <ellipse cx="30" cy="5" rx="4" ry="2"/>
    </g>
  </g>

  <!-- Floating fries -->
  <g transform="translate(610 350) rotate(13)">
    <path d="M-42 -20 L42 -20 L32 58 Q0 78 -32 58Z" fill="#d99d35"/>
    <path d="M-34 -25 L-27 -85 L-12 -85 L-10 -25 M-9 -25 L-4 -100 L12 -100 L10 -25 M17 -25 L28 -80 L43 -80 L34 -25"
      fill="#f2c35f" stroke="#d99d35" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-42 -20 L42 -20" stroke="#fff0c8" stroke-width="5"/>
  </g>

  <!-- Delivery bag -->
  <g transform="translate(400 355)">
    <path d="M-115 -65 L115 -65 L100 115 Q0 145 -100 115Z" fill="url(#bag)"/>
    <path d="M-55 -65 Q-55 -135 0 -135 Q55 -135 55 -65"
      fill="none" stroke="#173d78" stroke-width="18" stroke-linecap="round"/>
    <path d="M-115 -65 L115 -65" stroke="#78a8eb" stroke-width="7"/>
    <rect x="-46" y="-8" width="92" height="72" rx="23" fill="url(#gold)"/>
    <circle cx="0" cy="28" r="25" fill="#fff5d9" opacity=".9"/>
    <path d="M-12 31 Q0 7 12 31 M-10 36 L10 36"
      fill="none" stroke="#b88931" stroke-width="5" stroke-linecap="round"/>
    <path d="M-75 95 Q0 120 75 95" fill="none" stroke="#83b3f1" stroke-width="5" opacity=".65"/>
  </g>

  <!-- Floating pizza slice -->
  <g transform="translate(215 405) rotate(15)">
    <path d="M0 -55 L65 58 Q0 85 -65 58Z" fill="#e9ad51" stroke="#c77d32" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-50 48 Q0 68 50 48" fill="none" stroke="#f8df9d" stroke-width="12"/>
    <g fill="#bd4c3f">
      <circle cx="-12" cy="10" r="9"/>
      <circle cx="24" cy="34" r="8"/>
      <circle cx="-27" cy="43" r="7"/>
    </g>
  </g>

  <!-- Decorative sparkles -->
  <g fill="#d8a53d">
    <path d="M120 300 L128 320 L148 328 L128 336 L120 356 L112 336 L92 328 L112 320Z"/>
    <path d="M670 220 L676 235 L691 241 L676 247 L670 262 L664 247 L649 241 L664 235Z"/>
    <circle cx="300" cy="110" r="7"/>
    <circle cx="520" cy="480" r="8"/>
  </g>
</svg>
